<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="top" id="top1">
        <img src="imgs/logopufba.png" alt="">
    </div>
    <div class="top">

    </div>
    <div class="container">
        <div class="header">
            <img src="imgs/sic_logo_login.png" alt="Logo" class="logo">
            <h1>Cadastro</h1>
        </div>
        
        <form id="cadastroForm">
            <div class="input-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" required>
            </div>
            <div class="input-group">
                <label for="matricula">N° Matrícula:</label>
                <input type="text" id="matricula" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
            </div>
            <div class="input-group">
                <label for="confirmaSenha">Confirmar Senha:</label>
                <input type="password" id="confirmaSenha" required>
            </div>
            <button type="submit">Cadastrar</button>
            <p id="mensagemErro"></p>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
